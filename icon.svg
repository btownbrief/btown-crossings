    <path d="M28 2 L33 14 L44 8 L40 22 L54 20 L44 32 L56 38 L42 42 L48 54 L34 48 L32 62 L24 50 L12 58 L16 42 L2 44 L12 32 L2 24 L16 22 L10 8 L23 14 Z" fill="#e8912d" stroke="#b06e14" stroke-width="2.5" stroke-linejoin="round"/>
