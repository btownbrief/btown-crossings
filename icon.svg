  <text x="39" y="63" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="900" fill="#3a2413" text-anchor="middle">B</text>
  <rect x="48" y="30" width="34" height="34" rx="7" fill="#f2d9a6" stroke="#c9a468" stroke-width="3"/>
  <rect x="48" y="58" width="34" height="6" rx="3" fill="#c9a468"/>
  <text x="65" y="55" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="900" fill="#3a2413" text-anchor="middle">T</text>
