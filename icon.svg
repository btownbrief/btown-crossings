<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#14201b"/>
  <!-- crossing premium squares -->
  <rect x="10" y="10" width="24" height="24" rx="5" fill="#8f3e34"/>
  <rect x="66" y="66" width="24" height="24" rx="5" fill="#2e7d46"/>
  <rect x="66" y="10" width="24" height="24" rx="5" fill="#2e6f8f"/>
